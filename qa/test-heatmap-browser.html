<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Teste visual — 50 mil registros</title>
<style>body{margin:0;font:14px sans-serif}#status{padding:8px}iframe{width:100%;height:90vh;border:0}</style>
<div id="status">Preparando 50 mil registros sintéticos, sem salvar planilhas…</div>
<iframe id="app" src="../mapa-brasil-municipios.html"></iframe>
<script>
document.getElementById('app').onload = async function () {
  const win = this.contentWindow;
  const status = document.getElementById('status');
  try {
    // Run on an isolated localhost origin. Synthetic imports must not persist.
    win.BasesUI.storage.saveSlot = async () => true;
    const cities = win.MUNICIPIOS_INDEX.filter((_, i) => i % 11 === 0);
    const header = Array(16).fill('');
    header[3] = 'IS Atual'; header[14] = 'Cidade/UF';
    const rows = [header.join(';')];
    for (let i = 0; i < 50000; i++) {
      const city = cities[Math.floor(Math.pow(i / 50000, 2) * cities.length)];
      const row = Array(16).fill('');
      row[3] = 'Teste sintético'; row[14] = `${city.name}/${city.uf}`;
      rows.push(row.join(';'));
    }
    await win.BasesUI.importFile(new win.File([rows.join('\n')], 'teste-50000.csv'), 'quali');
    const start = Date.now();
    const timer = setInterval(() => {
      const summary = win.document.getElementById('bases-summary').textContent;
      if (summary.includes('50.000 de 50.000')) {
        clearInterval(timer);
        const paths = win.document.querySelectorAll('.leaflet-person-bases-pane path');
        status.textContent = `PASS: ${summary} ${paths.length} polígonos coloridos, sem selecionar TOTAL manualmente.`;
      } else if (Date.now() - start > 60000) {
        clearInterval(timer); status.textContent = `FAIL: ${summary}`;
      }
    }, 100);
  } catch (error) { status.textContent = `FAIL: ${error.message}`; }
};
</script>
</html>
